<!DOCTYPE html>
<html>
<head>
  <title>Exchange Rate Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Chart.js CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <!-- Title -->
    <h1 class="text-center mb-4">💱 Exchange Rate Dashboard</h1>

    <!-- Form Row -->
    <form id="convert-form" class="row g-3 justify-content-center">
      <div class="col-auto">
        <label for="from" class="form-label">Currency from:</label>
        <input type="text" class="form-control" id="from" value="USD" disabled>
      </div>

      <div class="col-auto">
        <label for="to" class="form-label">Currency to:</label>
        <select id="to" class="form-select">
          {% for cur in currencies %}
            <option value="{{ cur }}">{{ cur }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-auto">
        <label for="amount" class="form-label">Amount:</label>
        <input type="number" id="amount" class="form-control" value="100" />
      </div>

      <div class="col-auto">
        <label for="date" class="form-label">Date:</label>
        <input type="date" id="date" class="form-control" />
      </div>

      <div class="col-auto align-self-end">
        <button type="button" class="btn btn-primary" onclick="convert()">Convert</button>
      </div>
    </form>

    <!-- Result Card -->
    <div id="result" class="alert alert-info mt-4 text-center fw-bold" style="display: none;"></div>
    
    <!-- Exchange Rate Chart -->
    <div class="card mt-5 shadow-sm">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0">Exchange Rate History (USD → Selected)</h5>
      </div>
      <div class="card-body">
        <canvas id="rateChart" height="80"></canvas>
      </div>
    </div>

    <!-- Rate Table Section -->
    <div class="card mt-5 shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Current Exchange Rates</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          {{ table|safe }}
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
</body>
</html>
